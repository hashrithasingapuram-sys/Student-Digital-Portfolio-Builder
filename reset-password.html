<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — PortfolioX</title>
<meta name="theme-color" content="#0D1445">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body data-page="reset">
<main class="auth-page">
  <div class="auth-card">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">PX</span>PortfolioX</a>
    <h1>Reset your password</h1>
    <div id="form-msg" class="msg" role="alert" hidden></div>
    <form id="auth-form" novalidate hidden>
      <div class="field">
        <label for="password">New password</label>
        <div class="pw-wrap">
          <input id="password" name="password" type="password" autocomplete="new-password" required placeholder="Min 8 characters">
          <button class="toggle-pw" type="button" data-target="password" aria-pressed="false">Show</button>
        </div>
        <p class="hint">At least 8 characters with letters and numbers.</p>
      </div>
      <div class="field">
        <label for="confirm">Confirm new password</label>
        <div class="pw-wrap">
          <input id="confirm" name="confirm" type="password" autocomplete="new-password" required placeholder="Repeat password">
          <button class="toggle-pw" type="button" data-target="confirm" aria-pressed="false">Show</button>
        </div>
      </div>
      <button class="btn btn-primary" type="submit">Update password</button>
    </form>
    <p id="request-new" hidden style="margin-top:1rem">
      <a href="/forgot-password.html">Request a new reset link</a>
    </p>
    <div class="auth-links"><a href="/login.html">&larr; Back to log in</a></div>
  </div>
</main>
<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
