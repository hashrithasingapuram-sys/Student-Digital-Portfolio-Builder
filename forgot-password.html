<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password — PortfolioX</title>
<meta name="theme-color" content="#0D1445">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body data-page="forgot">
<main class="auth-page">
  <div class="auth-card">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">PX</span>PortfolioX</a>
    <h1>Forgot your password?</h1>
    <p class="muted" style="margin-bottom:1.25rem">Enter your email and we&rsquo;ll send a reset link.</p>
    <div id="form-msg" class="msg" role="alert" hidden></div>
    <form id="auth-form" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
      </div>
      <button class="btn btn-primary" type="submit">Send reset link</button>
    </form>
    <div class="auth-links">
      <a href="/login.html">&larr; Back to log in</a>
    </div>
  </div>
</main>
<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
