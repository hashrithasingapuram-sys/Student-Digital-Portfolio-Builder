<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects — PortfolioX</title>
<meta name="theme-color" content="#0D1445">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body data-page="projects">
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <button id="menu-btn" class="icon-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">&#9776;</button>
  <a class="brand" href="/dashboard.html"><span class="brand-mark" aria-hidden="true">PX</span>PortfolioX</a>
</header>
<div class="shell">
  <aside id="sidebar" class="sidebar" aria-label="Sidebar"></aside>
  <main id="main" class="main">

    <div class="page-head">
      <div><h1>Projects</h1><p class="muted">Show the work you have genuinely done.</p></div>
      <button id="add-btn" class="btn btn-primary" type="button">+ Add project</button>
    </div>
    <div id="status" role="status" aria-live="polite" hidden></div>

    <div class="toolbar">
      <label class="sr-only" for="search">Search projects</label>
      <input id="search" type="search" placeholder="Search projects or technologies&hellip;">
      <label class="sr-only" for="cat-filter">Filter by category</label>
      <select id="cat-filter"><option value="">All categories</option></select>
      <span id="count" class="small muted" aria-live="polite"></span>
    </div>
    <div id="project-list" class="grid-auto"></div>

    <dialog id="project-dialog" aria-labelledby="dialog-title">
      <div class="dialog-body">
        <h2 id="dialog-title">Add project</h2>
        <form id="project-form" novalidate>
          <div class="form-grid">
            <div class="field full">
              <label for="title">Project title <span class="req" aria-hidden="true">*</span></label>
              <input id="title" name="title" type="text" required maxlength="100" placeholder="My Awesome Project">
            </div>
            <div class="field full">
              <label for="description">Short description <span class="req" aria-hidden="true">*</span></label>
              <textarea id="description" name="description" required maxlength="500" placeholder="What did you build and why? (20–500 characters)"></textarea>
            </div>
            <div class="field full">
              <label for="purpose">Problem solved / purpose</label>
              <textarea id="purpose" name="purpose" maxlength="500" placeholder="What problem does it solve?"></textarea>
            </div>
            <div class="field full">
              <label for="technologies">Technologies used <span class="req" aria-hidden="true">*</span></label>
              <input id="technologies" name="technologies" type="text" required maxlength="600" placeholder="HTML, CSS, JavaScript, React&hellip;">
              <p class="hint">Separate with commas.</p>
            </div>
            <div class="field">
              <label for="category">Category <span class="req" aria-hidden="true">*</span></label>
              <select id="category" name="category" required><option value="">Choose category</option></select>
            </div>
            <div class="field">
              <label for="completed_on">Completion date</label>
              <input id="completed_on" name="completed_on" type="date">
            </div>
            <div class="field full">
              <label for="role">Your role / contribution</label>
              <input id="role" name="role" type="text" maxlength="200" placeholder="e.g. Full-stack developer, sole contributor">
            </div>
            <div class="field">
              <label for="github_url">GitHub repository URL</label>
              <input id="github_url" name="github_url" type="url" placeholder="https://github.com/you/repo">
              <p class="hint">Must be a github.com link (optional).</p>
            </div>
            <div class="field">
              <label for="live_url">Live demo URL</label>
              <input id="live_url" name="live_url" type="url" placeholder="https://your-demo.com">
            </div>
          </div>
          <div class="check"><input id="is_featured" name="is_featured" type="checkbox"><label for="is_featured">Featured project (shown first on your portfolio)</label></div>
          <div class="check"><input id="is_public" name="is_public" type="checkbox"><label for="is_public">Show on my public portfolio</label></div>
          <div class="dialog-actions">
            <button id="cancel-btn" class="btn btn-secondary" type="button">Cancel</button>
            <button class="btn btn-primary" type="submit">Save project</button>
          </div>
        </form>
      </div>
    </dialog>

  </main>
</div>
<div id="scrim" class="scrim"></div>
<script src="/js/common.js"></script>
<script src="/js/projects.js"></script>
</body>
</html>
